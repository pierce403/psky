[package]
name = "psky"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "PurpleSky reconstruction laboratory and Hypersnap preflight console"
publish = false

[dependencies]
psky-hypersnap = { path = "../psky-hypersnap" }
psky-repo = { path = "../psky-repo" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
