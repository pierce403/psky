[package]
name = "psky-hypersnap"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Bounded, read-only Hypersnap preflight for PurpleSky"
license = "MIT"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
