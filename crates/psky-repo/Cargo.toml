[package]
name = "psky-repo"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Deterministic ATProto repository primitives for the PurpleSky offline harness"
license = "MIT"

[dependencies]
base64 = "0.22.1"
cid = { version = "0.11.1", features = ["serde"] }
ipld-core = { version = "0.4.2", features = ["serde"] }
k256 = { version = "0.13.4", features = ["ecdsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_ipld_dagcbor = "0.6.4"
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
proptest = "1.9.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
