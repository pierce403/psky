<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PurpleSky: a protocol proposal exploring a fusion of atproto and Farcaster.">
    <meta name="theme-color" content="#171024">
    <title>PurpleSky Protocol Proposal</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171024; color: #f2eafa; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      main { width: 100%; max-width: 42rem; }
      .status { color: #c6a1f2; font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; }
      h1 { font-size: clamp(3rem, 12vw, 5rem); letter-spacing: -.06em; margin: 1rem 0; }
      p { color: #c9bfd7; font-size: 1.15rem; line-height: 1.7; }
      a { color: #d6b2ff; text-underline-offset: .25em; }
      a:hover { color: #fff; }
      a:focus-visible { outline: 2px solid #d6b2ff; outline-offset: 5px; }
      footer { margin-top: 3rem; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="status">Protocol proposal · Coming soon</span>
      <h1>PurpleSky</h1>
      <p>A proposal exploring a fusion of atproto and the Farcaster protocols.</p>
      <p>The proposal is taking shape. Details will follow.</p>
      <footer><a href="https://github.com/pierce403/psky">Follow the proposal on GitHub</a></footer>
    </main>
  </body>
</html>
