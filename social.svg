<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
>
  <title>PurpleSky — one logical PDS, many nodes</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#c69af8" />
      <stop offset="1" stop-color="#7ecbff" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#563276" stop-opacity=".35" />
      <stop offset="1" stop-color="#563276" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#bcaed4" opacity=".15" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b0911" />
  <rect x="650" width="550" height="630" fill="url(#grid)" />
  <ellipse cx="905" cy="330" rx="320" ry="280" fill="url(#glow)" />
  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(64 49)">
      <rect width="45" height="45" rx="12" fill="#1f152c" />
      <path
        d="M14 35V11H25L34 20 25 28H14"
        fill="none"
        stroke="url(#sky)"
        stroke-width="3.5"
        stroke-linejoin="round"
      />
      <circle cx="14" cy="35" r="3" fill="#c493ff" />
      <circle cx="34" cy="20" r="3" fill="#7ecbff" />
    </g>
    <text x="122" y="81" font-size="27" fill="#f5f0fa">
      PurpleSky
      <tspan fill="#c19af5">.</tspan>
    </text>
    <circle cx="71" cy="163" r="4" fill="#c19af5" />
    <text
      x="87"
      y="168"
      font-family="DejaVu Sans Mono, monospace"
      font-size="13"
      letter-spacing="1.5"
      fill="#c19af5"
