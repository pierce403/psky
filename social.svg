      SHARED ORDERED STATE
    </text>
    <text
      x="916"
      y="478"
      font-family="DejaVu Sans Mono, monospace"
      font-size="11"
      text-anchor="middle"
      fill="#ada0bb"
    >
      Deterministic projection + protected signer
    </text>
    <rect
      x="792"
      y="493"
      width="248"
      height="42"
      rx="6"
      fill="#142336"
      stroke="#6794bd"
    />
    <text x="916" y="520" font-size="18" text-anchor="middle" fill="#acd7fa">
      One signed ATProto repo
    </text>
    <path d="M64 566H1136" stroke="#35273f" />
    <text
      x="65"
      y="597"
      font-family="DejaVu Sans Mono, monospace"
      font-size="12"
      fill="#a99bb8"
    >
      ANY NODE. SAME REPOSITORY.
    </text>
    <text
      x="1135"
      y="597"
      text-anchor="end"
      font-family="DejaVu Sans Mono, monospace"
      font-size="13"
      fill="#c19af5"
