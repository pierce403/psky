<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PurpleSky — ATProto over Farcaster</title>
  <desc id="desc">One logical PDS. Many nodes. An original purple-to-blue node constellation surrounds the PurpleSky mark. Experimental protocol proposal at psky.org.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#c394ff" />
      <stop offset=".48" stop-color="#a9a5ff" />
      <stop offset="1" stop-color="#7ad5ff" />
    </linearGradient>
    <linearGradient id="headline" x1="64" y1="340" x2="585" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cb9aff" />
      <stop offset=".55" stop-color="#ada8ff" />
      <stop offset="1" stop-color="#82d1ff" />
    </linearGradient>
    <radialGradient id="violet">
      <stop stop-color="#763cca" stop-opacity=".34" />
      <stop offset="1" stop-color="#763cca" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blue">
      <stop stop-color="#3287c6" stop-opacity=".23" />
      <stop offset="1" stop-color="#3287c6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#261833" />
      <stop offset="1" stop-color="#142436" />
    </linearGradient>
    <linearGradient id="fade">
      <stop stop-color="#fff" stop-opacity="0" />
      <stop offset=".55" stop-color="#fff" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#aca3d0" opacity=".17" />
    </pattern>
    <mask id="grid-fade"><rect x="620" y="16" width="564" height="598" fill="url(#fade)" /></mask>
  </defs>
  <rect width="1200" height="630" fill="#0b0911" />
  <ellipse cx="884" cy="383" rx="360" ry="310" fill="url(#violet)" />
  <ellipse cx="1067" cy="132" rx="340" ry="300" fill="url(#blue)" />
  <rect x="620" y="16" width="564" height="598" fill="url(#grid)" mask="url(#grid-fade)" />
  <rect x="16.5" y="16.5" width="1167" height="597" rx="22" fill="none" stroke="#302639" />
  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(64 59)">
      <rect width="45" height="45" rx="12" fill="#21162e" />
      <path d="M14 35V11H25L34 20 25 28H14" fill="none" stroke="url(#sky)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="14" cy="35" r="3" fill="#c394ff" />
      <circle cx="14" cy="11" r="3" fill="#b5a1ff" />
      <circle cx="34" cy="20" r="3" fill="#7ad5ff" />
    </g>
    <text x="124" y="91" font-size="30" font-weight="600" letter-spacing="-.8" fill="#f5f1fc">PurpleSky<tspan fill="#b59bfc">.</tspan></text>
    <text x="62" y="259" font-size="73" font-weight="600" letter-spacing="-3.7" fill="#f6f3fc">ATProto over</text>
    <text x="61" y="356" font-size="96" font-weight="700" letter-spacing="-5" fill="url(#headline)">Farcaster.</text>
    <text x="66" y="419" font-size="27" letter-spacing="-.5" fill="#ded8ed">One logical PDS. Many nodes.</text>
    <text x="67" y="457" font-size="21" fill="#a9a0bd">Shared state. Standard ATProto.</text>
    <!-- A protocol constellation, not separate repository heads. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="930" cy="295" r="173" stroke="#766496" stroke-opacity=".17" />
      <circle cx="930" cy="295" r="202" stroke="#766496" stroke-opacity=".1" stroke-dasharray="2 10" />
      <path d="M802 186L952 151 1091 211M952 151L1008 258M802 186L858 244M1091 211L1008 281" stroke="#67acd9" stroke-opacity=".65" stroke-width="2" />
      <path d="M858 322L788 397 921 450 1070 399 1008 330M921 364V450M788 397L812 465M1070 399L1043 465M921 450V475" stroke="#ad7fe0" stroke-opacity=".7" stroke-width="2" />
      <path d="M802 186L858 244M1070 399L1008 330" stroke="url(#sky)" stroke-width="3" />
    </g>
    <g fill="#122b40" stroke="#83c9f6" stroke-width="2">
      <circle cx="802" cy="186" r="11" />
      <circle cx="952" cy="151" r="8" />
      <circle cx="1091" cy="211" r="13" />
    </g>
    <g fill="#acdfff">
      <circle cx="802" cy="186" r="3" />
      <circle cx="952" cy="151" r="2.5" />
      <circle cx="1091" cy="211" r="4" />
    </g>
    <g fill="#2b1943" stroke="#c095f4" stroke-width="2">
      <circle cx="788" cy="397" r="12" />
      <circle cx="921" cy="450" r="9" />
      <circle cx="1070" cy="399" r="12" />
    </g>
    <g fill="#d4b4ff">
      <circle cx="788" cy="397" r="3.5" />
      <circle cx="921" cy="450" r="3" />
      <circle cx="1070" cy="399" r="3.5" />
    </g>
    <rect x="848" y="214" width="170" height="170" rx="42" fill="#14101f" stroke="#7f70a5" stroke-opacity=".2" />
    <rect x="858" y="224" width="150" height="150" rx="34" fill="url(#tile)" stroke="url(#sky)" stroke-width="1.5" />
    <path d="M902 337V258H943L970 285 943 310H902" fill="none" stroke="url(#sky)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="902" cy="337" r="8" fill="#c394ff" />
    <circle cx="902" cy="258" r="8" fill="#b5a1ff" />
    <circle cx="970" cy="285" r="8" fill="#7ad5ff" />
    <g font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2" text-anchor="middle">
      <text x="933" y="107" fill="#8fcdf5">ATPROTO</text>
      <text x="933" y="503" fill="#c89dfb">FARCASTER</text>
    </g>
    <path d="M64 540H1136" stroke="#42324f" stroke-opacity=".75" />
    <circle cx="70" cy="572" r="4" fill="#ba91f4" />
    <text x="85" y="577" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.2" fill="#b3a6c9">EXPERIMENTAL PROTOCOL PROPOSAL</text>
    <text x="1136" y="579" text-anchor="end" font-size="22" fill="#ded4ef">psky.org<tspan dx="10" fill="#9bcaf1">↗</tspan></text>
  </g>
</svg>
