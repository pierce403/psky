    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".8" fill="#bcaed4" opacity=".15" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0b0911" />
  <rect x="610" width="590" height="630" fill="url(#grid)" />
  <ellipse cx="865" cy="300" rx="350" ry="350" fill="url(#glow)" />
