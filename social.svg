      ONE LOGICAL PDS
    </text>
    <g fill="#1b1424" stroke="#82619c">
      <rect x="690" y="292" width="112" height="52" rx="7" />
      <rect x="860" y="292" width="112" height="52" rx="7" />
      <rect x="1030" y="292" width="112" height="52" rx="7" />
    </g>
    <g font-size="18" text-anchor="middle" fill="#f0e7f9">
      <text x="746" y="324">Node A</text>
      <text x="916" y="324">Node B</text>
      <text x="1086" y="324">Node C</text>
    </g>
    <rect
      x="771"
      y="390"
      width="290"
      height="62"
      rx="9"
      fill="#271933"
      stroke="#b285d3"
    />
    <text x="916" y="417" font-size="22" text-anchor="middle" fill="#d5b3f7">
      Snapchain / Hypersnap
    </text>
    <text
      x="916"
      y="439"
      font-family="DejaVu Sans Mono, monospace"
      font-size="12"
      text-anchor="middle"
      fill="#bfaace"
