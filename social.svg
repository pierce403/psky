      EXPERIMENTAL PROTOCOL PROPOSAL
    </text>
    <text x="61" y="268" font-size="69" letter-spacing="-3" fill="#f5f0fa">
      ATProto over
    </text>
    <text x="61" y="350" font-size="76" letter-spacing="-3" fill="url(#sky)">
      Snapchain.
    </text>
    <text x="65" y="410" font-size="24" fill="#eee4f7">
      One logical PDS. Many nodes.
    </text>
    <text x="65" y="451" font-size="20" fill="#c6bdd3">
      Replaceable workers. Shared state.
    </text>
    <text x="65" y="484" font-size="20" fill="#c6bdd3">
      One canonical repository per DID.
    </text>
    <g stroke="#82629b" stroke-width="1.5" fill="none">
      <path
        d="M916 146V177M916 243V270H746V292M916 270V292M916 270H1086V292M746 344C746 378 856 369 885 390M916 344V390M1086 344C1086 378 976 369 947 390M916 452V458M916 483V493"
      />
    </g>
    <text
      x="916"
      y="128"
      font-family="DejaVu Sans Mono, monospace"
      font-size="15"
      text-anchor="middle"
      fill="#c7b3e0"
    >
      ETH / Farcaster identity
    </text>
    <rect
      x="755"
      y="177"
      width="322"
      height="66"
      rx="12"
      fill="#1b1226"
      stroke="url(#sky)"
    />
    <text x="916" y="205" font-size="22" text-anchor="middle" fill="#f0e7f9">
      PurpleSky
    </text>
    <text
      x="916"
      y="228"
      font-family="DejaVu Sans Mono, monospace"
      font-size="13"
      text-anchor="middle"
      fill="#bea7d8"
